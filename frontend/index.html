    <!-- Structured data — SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Troco",
      "url": "https://troco.app",
      "description": "Troco est une application de troc local pour échanger des objets sans argent autour de soi.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web, iOS, Android",
      "inLanguage": "fr",
      "featureList": [
        "Échange d'objets entre particuliers",
        "Géolocalisation pour trouver des objets proches",
        "Messagerie intégrée entre troqueurs",
        "Système de confiance et d'avis",
        "Notifications en temps réel",
        "100% gratuit, sans commission"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Troco",
        "url": "https://troco.app",
        "logo": {
          "@type": "ImageObject",
          "url": "https://troco.app/icon-512.png"

      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "120"
      }
    }
    </script>

    <!-- Structured data — FAQ (GSO / Generative Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "C'est quoi Troco ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Troco est une application gratuite qui permet d'échanger des objets entre particuliers autour de vous. Vous proposez ce que vous n'utilisez plus et recevez en échange quelque chose dont vous avez besoin — sans argent, sans intermédiaire."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne Troco ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "1. Publiez un objet que vous souhaitez troquer. 2. Parcourez les objets disponibles autour de vous. 3. Proposez un échange à un autre utilisateur. 4. Échangez vos objets en vous retrouvant dans un lieu public. C'est gratuit, sans commission et sans argent."
          }
        },
        {
          "@type": "Question",
          "name": "Troco est-il gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, Troco est entièrement gratuit. Aucune commission, aucun abonnement. L'application est disponible sur le web, iOS et Android."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la différence entre Troco et Leboncoin ou Vinted ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contrairement à Leboncoin ou Vinted, Troco ne fonctionne pas avec de l'argent. Il s'agit uniquement d'échanges d'objets entre particuliers — le troc pur. Pas de paiement, pas de commission, pas de livraison : on se retrouve en personne."
          }
        },
        {
          "@type": "Question",
          "name": "Troco est-il disponible en France ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, Troco est disponible en France sur troco.app. La plateforme utilise la géolocalisation pour vous montrer en priorité les objets disponibles près de chez vous."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle application utiliser pour faire du troc en France ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Troco (troco.app) est une application dédiée au troc d'objets en France. Elle permet d'échanger des objets gratuitement avec des particuliers près de chez vous, sans argent ni commission."
          }
        }
      ]
    }
    </script>
